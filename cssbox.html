<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model Demo</title>
</head>
<body style="background:#2d3e50; padding:40px;">

    <h2 style="color:white; text-align:center; font-family:Arial;">CSS BOX MODEL
        
    </h2>

    
    <div style="background:#e0512a; padding:5px;text-align:center; 
                            color:white; font-family:Arial; font-size:20px;">
                            Margin
          

        
        <div style="background:#00aabb; padding:10px; border:5px solid #008899;text-align:center; 
                            color:white; font-family:Arial; font-size:20px;">
            Border
            

            
            <div style="background:#f9c74f; padding:20px;text-align:center; 
                            color:white; font-family:Arial; font-size:20px;">
                Padding

                
                <div style="background:#20c997; padding:50px; text-align:center; 
                            color:white; font-family:Arial; font-size:20px;">
                    Content
                </div>
                 

        </div>

    </div>

</body>
</html>
